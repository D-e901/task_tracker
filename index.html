<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_TrackerHD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="form-side">

            <div class="header">
                <h2>Créer une tâche:</h2>
            </div>

            <div class="form-container">
                <!-- Le "submit" est intercepté en JS pour ne pas recharger la page
                     (voir form.addEventListener("submit", ...) plus bas). -->
                <form id="taskForm">

                    <label for="title">Libellé: </label>
                    <input type="text" id="title" name="libel" placeholder="Le libellé de la tâche">

                    <label for="description">Description: </label>
                    <textarea id="description" name="descript" placeholder="Décrivez ce que vous souhaitez accomplir comme tâche...." cols="30" rows="10"></textarea>

                    <button type="submit" id="addTaskBtn" class="btn add-btn">Enregistrer</button>
                </form>
            </div>
        </div>

        <div class="main">

            <div class="header">
                <h2>Liste des tâches</h2>
            </div>

            <table id="taskTable" class="table-task">
                <thead>
                    <tr>
                        <th>Libellé</th>
                        <th>Statut</th>
                        <th>Opérations</th>
                    </tr>
                </thead>

                <tbody id="taskBody">

                </tbody>
            </table>
        </div>

    </div>

    <script>
        /* =========================================================
           ÉTAT
           ========================================================= */

        // Ordre des statuts possibles. L'index dans ce tableau représente
        // la progression : on ne peut avancer que vers l'index suivant,
        // jamais revenir en arrière. C'est ça qui garantit l'irréversibilité.
        const STATUS_FLOW = ["draft", "ongoing", "done"];

        // Libellé, classe CSS (couleur) et texte du bouton "étape suivante"
        // associés à chaque statut.
        const STATUS_META = {
            draft:   { label: "Brouillon", cssClass: "status-draft",   nextLabel: "Démarrer →" },
            ongoing: { label: "En cours",  cssClass: "status-ongoing", nextLabel: "Terminer ✓" },
            done:    { label: "Terminé",   cssClass: "status-done",    nextLabel: null } // null = pas d'étape suivante
        };

        /* =========================================================
           RÉFÉRENCES AUX ÉLÉMENTS DU DOM
           ========================================================= */

        const form = document.getElementById("taskForm");
        const titleInput = document.getElementById("title");
        const descriptionInput = document.getElementById("description");
        const taskBody = document.getElementById("taskBody");

        document.addEventListener("DOMContentLoaded", loadTasks);

        // On écoute le "submit" du formulaire (déclenché par Entrée ou par clic
        // sur "Enregistrer") et on empêche le rechargement de la page.
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            addTask();
        });


        /* =========================================================
           STOCKAGE (localStorage)
           ========================================================= */

        function getTasksFromLocalStorage() {
            const tasks = localStorage.getItem("tasks");
            return tasks ? JSON.parse(tasks) : [];
        }

        function saveTasksToLocalStorage(tasks) {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }


        /* =========================================================
           CHARGEMENT INITIAL
           ========================================================= */

        function loadTasks() {
            displayTasks();
        }


        /* =========================================================
           CRÉATION D'UNE TÂCHE
           ========================================================= */

        function addTask() {
            const titleValue = titleInput.value.trim();
            const descriptionValue = descriptionInput.value.trim();

            if (!titleValue) {
                titleInput.focus();
                return;
            }

            const tasks = getTasksFromLocalStorage();

            // Toute nouvelle tâche démarre obligatoirement à "draft".
            tasks.push({
                title: titleValue,
                description: descriptionValue,
                status: "draft"
            });

            saveTasksToLocalStorage(tasks);

            titleInput.value = "";
            descriptionInput.value = "";
            displayTasks();
        }


        /* =========================================================
           PROGRESSION DE STATUT (draft -> ongoing -> done, jamais l'inverse)
           ========================================================= */

        // Renvoie le statut suivant dans STATUS_FLOW, ou null si on est
        // déjà au dernier statut ("done" n'a pas de suite).
        function getNextStatus(currentStatus) {
            const currentIndex = STATUS_FLOW.indexOf(currentStatus);
            const nextIndex = currentIndex + 1;
            return nextIndex < STATUS_FLOW.length ? STATUS_FLOW[nextIndex] : null;
        }

        function advanceTaskStatus(index) {
            const tasks = getTasksFromLocalStorage();
            const task = tasks[index];
            const next = getNextStatus(task.status);

            // Si next est null (tâche déjà "done"), on ne fait rien : c'est la
            // SEULE fonction qui modifie le statut, et elle n'avance que
            // d'une étape à la fois. Il n'y a donc aucun moyen de reculer.
            if (next) {
                task.status = next;
                saveTasksToLocalStorage(tasks);
                displayTasks();
            }
        }


        /* =========================================================
           AFFICHAGE
           ========================================================= */

        function displayTasks() {
            const tasks = getTasksFromLocalStorage();
            taskBody.innerHTML = "";

            tasks.forEach((task, index) => {
                const meta = STATUS_META[task.status];
                const row = document.createElement("tr");

                // Le bouton d'avancement n'est généré que si un statut suivant existe.
                const advanceButtonHtml = meta.nextLabel
                    ? `<button class="btn-advance" onclick="advanceTaskStatus(${index})" title="Cette action est définitive">${meta.nextLabel}</button>`
                    : `<span class="locked-label">Statut final</span>`;

                row.innerHTML = `
                        <td>
                            <div class="task-title">${task.title}</div>
                            ${task.description ? `<div class="task-desc">${task.description}</div>` : ""}
                        </td>
                        <td>
                            <span class="status-badge ${meta.cssClass}">${meta.label}</span>
                        </td>
                        <td class="ops-cell">
                            ${advanceButtonHtml}
                        </td>
                    `;
                taskBody.appendChild(row);
            });
        }
    </script>

</body>
</html>
