<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_TrackerHD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="form-side">

            <div class="header">
                <h2 id="form-title">Créer une tâche:</h2>
            </div>

            <div class="form-container">
                
                <form id="taskForm">

                    <label for="title">Libellé: </label>
                    <input type="text" id="title" name="libel" placeholder="Le libellé de la tâche">

                    <label for="description">Description: </label>
                    <textarea id="description" name="descript" placeholder="Décrivez ce que vous souhaitez accomplir comme tâche...." cols="30" rows="10"></textarea>

                    <button type="submit" id="addTaskBtn" class="btn add-btn">Enregistrer</button>
                </form>
            </div>
        </div>

        <div class="main">

            <div class="header">
                <h2>Liste des tâches</h2>
            </div>

            <table id="taskTable" class="table-task">
                <thead>
                    <tr>
                        <th>Libellé</th>
                        <th>Statut</th>
                        <th>Opérations</th>
                    </tr>
                </thead>

                <tbody id="taskBody">

                </tbody>
            </table>
        </div>

    </div>

    <script>
        
        const STATUS_FLOW = ["draft", "ongoing", "done"];

        const STATUS_META = {
            draft:   { label: "Brouillon", cssClass: "status-draft",   hint: "Cliquer pour démarrer" },
            ongoing: { label: "En cours",  cssClass: "status-ongoing", hint: "Cliquer pour terminer" },
            done:    { label: "Terminé",   cssClass: "status-done",    hint: null }
        };

        let editingIndex = null;

        const formTitle = document.getElementById("form-title");
        const form = document.getElementById("taskForm");
        const titleInput = document.getElementById("title");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const descriptionInput = document.getElementById("description");
        const taskBody = document.getElementById("taskBody");

        document.addEventListener("DOMContentLoaded", loadTasks);

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            addTask();
        });

        function getTasksFromLocalStorage() {
            const raw = localStorage.getItem("tasks");
            if (!raw) 
                return [];

            let tasks;
            try {
                tasks = JSON.parse(raw);
            } catch (e) {

                return [];
            }

            if (!Array.isArray(tasks)) 
                return [];

            return tasks.map(function (task) {
                if (typeof task === "string") {
                    return { title: task, description: "", status: "draft" };
                }
                return {
                    title: task.title || "",
                    description: task.description || "",
                    status: STATUS_FLOW.includes(task.status) ? task.status : "draft"
                };
            });
        }

        function saveTasksToLocalStorage(tasks) {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            displayTasks();
        }

        function addTask() {
            const titleValue = titleInput.value.trim();
            const descriptionValue = descriptionInput.value.trim();

            if (!titleValue) {
                titleInput.focus();
                return;
            }

            const tasks = getTasksFromLocalStorage();

            if (editingIndex !== null) {
                tasks[editingIndex].title = titleValue;
                tasks[editingIndex].description = descriptionValue;
                exitEditMode();
            } else {
                tasks.push({
                    title: titleValue,
                    description: descriptionValue,
                    status: "draft"
                });
            }

            saveTasksToLocalStorage(tasks);

            titleInput.value = "";
            descriptionInput.value = "";
            displayTasks();
        }

        function getNextStatus(currentStatus) {
            const currentIndex = STATUS_FLOW.indexOf(currentStatus);
            const nextIndex = currentIndex + 1;
            return nextIndex < STATUS_FLOW.length ? STATUS_FLOW[nextIndex] : null;
        }

        function advanceTaskStatus(index) {
            const tasks = getTasksFromLocalStorage();
            const task = tasks[index];
            const next = getNextStatus(task.status);

            if (next) {
                task.status = next;
                saveTasksToLocalStorage(tasks);
                displayTasks();
            }
        }

        function displayTasks() {
            const tasks = getTasksFromLocalStorage();
            taskBody.innerHTML = "";

            tasks.forEach((task, index) => {
                const meta = STATUS_META[task.status];
                const row = document.createElement("tr");

                const badgeHtml = meta.hint
                    ? `<button type="button" class="status-badge ${meta.cssClass} is-clickable" onclick="advanceTaskStatus(${index})"
                               title="${meta.hint} (action définitive)">${meta.label}
                        </button>`
                    : `<span class="status-badge ${meta.cssClass}">${meta.label}</span>`;

                row.innerHTML = `
                        <td>
                            <div class="task-title">${task.title}</div>
                            ${task.description ? `<div class="task-desc">${task.description}</div>` : ""}
                        </td>
                        <td>
                            ${badgeHtml}
                        </td>
                        <td>
                            <button onclick="editTask(${index})">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                                    <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
                                </svg>
                            </button>

                            <button onclick="deleteTask(${index})">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                                    <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </td>
                    `;
                taskBody.appendChild(row);
            });
        }

        function editTask(index) {
            const tasks = getTasksFromLocalStorage();
            const task = tasks[index];

            titleInput.value = task.title;
            descriptionInput.value = task.description;
            editingIndex = index;

            addTaskBtn.textContent = "Modifier";
            addTaskBtn.classList.add("is-editing");
            formTitle.textContent = "Modifier la tâche :";
            titleInput.focus();
        }

        function exitEditMode() {
            editingIndex = null;
            addTaskBtn.textContent = "Enregistrer";
            addTaskBtn.classList.add("is-editing");
            formTitle.textContent = "Créer une tâche:";
        }

        function deleteTask(index) {
            // const confirmed = window.confirm("Supprimer définitivement cette tâche ?");
            // if (!confirmed) return;

            const tasks = getTasksFromLocalStorage();
            tasks.splice(index, 1);
            saveTasksToLocalStorage(tasks);

            if (editingIndex === index) {
                titleInput.value = "";
                descriptionInput.value = "";
                exitEditMode();
            }

            displayTasks();
        }

        function getNextStatus(currentStatus) {
            const currentIndex = STATUS_FLOW.indexOf(currentStatus);
            const nextIndex = currentIndex + 1;
            return nextIndex < STATUS_FLOW.length ? STATUS_FLOW[nextIndex] : null;
        }

        function advanceTaskStatus(index) {
            const tasks = getTasksFromLocalStorage();
            const task = tasks[index];
            const next = getNextStatus(task.status);
            if (next) {
                task.status = next;
                saveTasksToLocalStorage(tasks);
                displayTasks();
            }
        }
    </script>

</body>
</html>
