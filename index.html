<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_TrackerHD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="form-side">

            <div class="header">
                <h2>Créer une tâche:</h2>
            </div>

            <div class="form-container">
                <form action="">

                    <label for="title">Libellé: </label>
                    <input type="text" id="title" name="libel" placeholder="Le libellé de la tâche">

                    <label for="description">Description: </label>
                    <textarea id="description" name="descript" placeholder="Décrivez ce que vous souhaitez accomplir comme tâche...." cols="30" rows="10">Décrivez ce que vous souhaitez accomplir comme tâche....</textarea>

                    <button onclick="setItem()" type="submit" id="addTaskBtn" class="btn add-btn">Enregistrer</button>
                </form>
            </div>
        </div>
        
        <div class="main">

            <div class="header">
                <h2>Liste des tâches</h2>
            </div>

            <table id="taskTable" class="table-task">
                <thead>
                    <tr>
                        <th>Libellé</th>
                        <th>Opérations</th>
                    </tr>
                </thead>

                <tbody id="taskBody">

                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
