<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task_TrackerHD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="form-side">

            <div class="header">
                <h2>Créer une tâche:</h2>
            </div>

            <form action="">

                <label for="title">Libellé: </label>
                <input type="text" id="title" name="libel" placeholder="Le libellé de la tâche">

                <label for="description">Description: </label>
                <textarea id="description" name="descript" placeholder="Décrivez ce que vous souhaitez accomplir comme tâche...." cols="30" rows="10">                    
                </textarea>

                <button onclick="setItem()" type="submit" id="addTaskBtn" class="btn add-btn">Enregistrer</button>
            </form>
        </div>
        
        <div class="main">
        </div>

    </div>
</body>
</html>
